name: Example infrastructure orchestration - across landing zones

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name of the infrastructure instance"
        required: true
        default: "myfakeinstance"
        type: string
      goldenModelChosen:
        description: "The golden path / package chosen"
        required: true
        default: "3-tier-webapp-onprem-and-oci"
        type: string
      environment:
        description: "Environment for the infrastructure instance"
        required: true
        default: "dev"
        type: string



jobs:
  request-infra-orchestration-vendors:
    name: Request New Infrastructure Sequence across Landing Zones
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # "service_owner_name": "internal-tools-org",


      - name: Echoing what we are validating
        shell: pwsh
        run: |
        
          Write-Host "3 services in one orchestration - where 2 are in a github organization and 1 is having different github owner context (larswurm) - but all are orchestrated through Zekt"
          Write-Host "None of the 3 services are listed in the public Zekt registry"
          Write-Host "Each service accept inputs (schema validation enforced) - and produce outputs to requestor through zekt-action"


      - name: Submit and wait
        id: orch
        uses: zekt-dev-org/zekt-action@v3
        with:
          orchestrate: true
          wait: true                      # Block until completed | failed | timed_out
          payload: |
            {
              "default_service_owner": "zekt-dev-org",
              "services": [
                {
                  "step_id": "create-on-prem-ns-here",
                  "service_slug": "new-op-k8namespace",
                  "input": {
                    "name": "${{ inputs.name }}",
                    "environment": "${{ inputs.environment }}",
                    "goldenModelChosen": "${{ inputs.goldenModelChosen }}"
                  }
                },
                {
                  "step_id": "create-oci-autonomous-db",
                  "service_slug": "new-oci-autonomous-db",
                  "depends_on": ["create-on-prem-ns-here"],
                  "input": {
                    "name": "${{ inputs.name }}",
                    "k8namespaceId": "${{ steps.create-on-prem-ns-here.outputs.k8_namespace_id }}"
                  }
                },
                {
                  "step_id": "create-oci-keyvault",
                  "service_slug": "new-oci-keyvault",
                  "depends_on": ["create-oci-autonomous-db"],
                  "service_owner_name": "larswurm",
                  "input": {
                    "name": "${{ inputs.name }}",
                    "environment": "${{ inputs.environment }}"
                  }
                }
              ]
            }

      - name: Process outputs from orchestrated services
        shell: pwsh
        run: |
          # Pattern: steps.<orch-step-id>.outputs.step_<payload-step_id>_outputs_<field>

          # --- Outputs from create-sub ---
          $subscriptionId = '${{ steps.orch.outputs.step_create-sub_outputs_subscription_id }}'
          $tenantId       = '${{ steps.orch.outputs.step_create-sub_outputs_tenant_id }}'

          # --- Outputs from create-resourcegroup ---
          $resourceGroup  = '${{ steps.orch.outputs.step_create-resourcegroup_outputs_resourcegroup_name }}'

          # --- Outputs from create-keyvault ---
          $keyvaultName   = '${{ steps.orch.outputs.step_create-keyvault_outputs_keyvault_name }}'

          Write-Host "Subscription    : $subscriptionId"
          Write-Host "Tenant          : $tenantId"
          Write-Host "Resource Group  : $resourceGroup"
          Write-Host "Key Vault       : $keyvaultName"
          
          # Forward any value downstream via GITHUB_OUTPUT
          # "subscription_id=$subscriptionId" >> $env:GITHUB_OUTPUT
          # "resource_group=$resourceGroup"   >> $env:GITHUB_OUTPUT


      - name: Confirmation
        run: |
          echo "✅ Event sent to Zekt successfully!"
          echo ""
          echo "📋 Summary:"
          echo "  - Event Type: service-new-infrastructure-sequence-request"
          echo "  - Event ID: ${{ steps.orch.outputs.execution_id }}"
          echo "  - Status: ${{ steps.orch.outputs.execution_status }}"
          echo "  - Workflow Run: ${{ github.run_id }}"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Triggered by: ${{ github.actor }}"
          echo "  - Infrastructure Instance Name: ${{ inputs.name }}"
          echo ""
