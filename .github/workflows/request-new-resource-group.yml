name: Request New Resource Group - from consumer service in Zekt

on:
  workflow_dispatch:
    inputs:
      tenantId:
        description: 'Tenant ID for the resource group'
        required: true
        default: '932312-323213231-32132132-13213221'
        type: string
      subscriptionId:
        description: 'Subscription ID for the resource group'
        required: true
        default: '333213-4343488-43434343-23234343'
        type: string
      region:
        description: 'Region for the resource group'
        required: true
        default: 'westeurope'
        type: string
      name:
        description: 'Name of the resource group'
        required: true
        default: 'rg-myfakeresourcegroup'
        type: string
      tag_department:
        description: 'Department tag for the resource group'
        required: true
        default: 'finance'
        type: string
      tag_contact:
        description: 'Contact phone number for the resource group'
        required: true
        default: '+4640203949494'
        type: string
      tag_contact_email:
        description: 'Contact email for the resource group'
        required: true
        default: 'user@example.com'
        type: string


jobs:
  request-resource-group-through-zekt:
    name: Request New Resource Group through Zekt
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build JSON Payload
        id: build-payload
        shell: pwsh
        run: |
          # Collect all input parameters into a structured JSON object
          Write-Host "Pre-collecting input parameters..."
          Write-Host ("CorrelationId: " + "${{ github.run_id }}")

          $payload = @{
              tenantId = "${{ inputs.tenantId }}"
              subscriptionId = "${{ inputs.subscriptionId }}"
              region = "${{ inputs.region }}"
              name = "${{ inputs.name }}"
              department = "${{ inputs.tag_department }}"
              contact = "${{ inputs.tag_contact }}"
              contact_email = "${{ inputs.tag_contact_email }}"
              workflowRunId = "${{ github.run_id }}"
              sender = "${{ github.actor }}"
          }
          
          Write-Host "Post-collecting input parameters..."
          
          # Convert to JSON string
          $jsonPayload = $payload | ConvertTo-Json -Compress
          
          # Output for next step
          Write-Host "Payload built:"
          Write-Host $jsonPayload
          
          # Set as output (escape for GitHub Actions)
          "payload=$jsonPayload" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          
      - name: Display Payload (Debug)
        run: |
          echo "🔍 Request payload to be sent to Zekt:"
          echo '${{ steps.build-payload.outputs.payload }}'

      - name: Send Request Payload to Zekt
        id: zekt
        uses: zekt-dev-org/zekt-action@v2.1.0
        with:
          event-type: 'service-new-resourcegroup-request'
          payload: ${{ steps.build-payload.outputs.payload }}

      - name: Confirmation
        run: |
          echo "✅ Event sent to Zekt successfully!"
          echo ""
          echo "📋 Summary:"
          echo "  - Event Type: service-new-resourcegroup-request"
          echo "  - Event ID: ${{ steps.zekt.outputs.event-id }}"
          echo "  - Status: ${{ steps.zekt.outputs.status }}"
          echo "  - Workflow Run: ${{ github.run_id }}"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Triggered by: ${{ github.actor }}"
          echo ""
