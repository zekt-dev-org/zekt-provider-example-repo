name: Example - Request infrastructure deployment through Zekt from provider


on:
  workflow_dispatch:
    inputs:
      project_name: 
        description: 'name of project to deploy infrastructure for'
        required: true
        default: 'myProjectName'
        type: string
      env_name:
        description: 'Environment name for the deployment'
        required: true
        default: 'test'
        type: string
      stack_properties:
        description: 'the stack properties, inputed as a string - to be JSON converted'
        required: true
        default: '{"stack_name":"three_tier_microservices_arc","stack_provider":"azure","stack_frontend_framework":"next.js","stack_compute_runtime":"dotnet_core|v10","stack_persistency":"cosmos"}'
        type: string
      customer_id:
        description: 'customer id to attribute deployment for'
        required: true
        default: 'ABC-123456'
        type: string
      tenant_id:
        description: 'the tenant id to deploy infrastructure in'
        required: true
        default: '8423879423789423897423789423'
        type: string
      network_properties:
        description: 'the network properties, inputed as a string - to be JSON converted'
        required: true
        default: '{"central_vnet_peeringId": "someResourceId","some_other_property": "someOtherValue"}'
        type: string


jobs:
  process-infra_deployment-request-through-zekt:
    name: Send Event & Message payload to Zekt
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC authentication
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build JSON Payload
        id: build-payload
        env:
          STACK_PROPERTIES: ${{ inputs.stack_properties }}
          NETWORK_PROPERTIES: ${{ inputs.network_properties }}
        shell: pwsh
        run: |
          # Collect all input parameters into a structured JSON object
          Write-Host "Pre-collecting input parameters..."
          Write-Host ("CorrelationId: " + "${{ github.run_id }}")

          # $stack_properties = (("${{ inputs.stack_properties }}") | ConvertFrom-Json) | ConvertTo-Json -Depth 10
          # $network_properties = (("${{ inputs.network_properties }}") | ConvertFrom-Json) | ConvertTo-Json -Depth 10

          $stack_properties = $env:STACK_PROPERTIES | ConvertFrom-Json | ConvertTo-Json -Depth 10
          $network_properties = $env:NETWORK_PROPERTIES | ConvertFrom-Json | ConvertTo-Json -Depth 10


          $payload = @{
              project_name = "${{ inputs.project_name }}"
              env_name = "${{ inputs.env_name }}"
              stack_properties = $stack_properties
              customer_id = "${{ inputs.customer_id }}"
              tenant_id = "${{ inputs.tenant_id }}"
              network_properties = $network_properties
              workflowRunId = "${{ github.run_id }}"
              update_date = "${{ inputs.update_date }}"
              sender = "${{ github.actor }}"
          }
          
          Write-Host "Post-collecting input parameters..."
          
          # Convert to JSON string
          $jsonPayload = $payload | ConvertTo-Json -Compress
          
          # Output for next step
          Write-Host "Payload built:"
          Write-Host $jsonPayload
          
          # Set as output (escape for GitHub Actions)
          "payload=$jsonPayload" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          
      - name: Display Payload (Debug)
        run: |
          echo "🔍 Infrastructure deployment request payload to be sent to Zekt:"
          echo '${{ steps.build-payload.outputs.payload }}'

      - name: Send Infrastructure request Payload to Zekt, shielded
        id: zekt
        uses: zekt-dev-org/zekt-action@v2.1.0
        with:
          event-type: 'zekt-infra-deployment-request-event'
          payload: ${{ steps.build-payload.outputs.payload }}
          shield: true

      - name: Confirmation
        run: |
          echo "✅ Event sent to Zekt successfully!"
          echo ""
          echo "📋 Summary:"
          echo "  - Event Type: zekt-infra-deployment-request-event"
          echo "  - Event ID: ${{ steps.zekt.outputs.event-id }}"
          echo "  - Status: ${{ steps.zekt.outputs.status }}"
          echo "  - Workflow Run: ${{ github.run_id }}"
          echo "  - Repository: ${{ github.repository }}"
          echo "  - Triggered by: ${{ github.actor }}"
          echo ""
